<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
    input, select, button { font-size: 1.1rem; padding: 8px; margin: 4px; }
    input { width: 90px; }
    #output { font-size: 1.3rem; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Calculator</h1>

  <input id="number1" type="number" step="any" placeholder="Number 1">
  <select id="operation">
    <option>+</option>
    <option>-</option>
    <option>*</option>
    <option>/</option>
  </select>
  <input id="number2" type="number" step="any" placeholder="Number 2">
  <button onclick="calculate()">=</button>

  <p id="output"></p>

  <script>
    async function calculate() {
      // const payload = {
      //   number1: document.getElementById("number1").value,
      //   operation: document.getElementById("operation").value,
      //   number2: document.getElementById("number2").value
      // };

      // const response = await fetch("/calculate", {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify(payload)
      // });

      // const data = await response.json();
      // const output = document.getElementById("output");

      // if (data.result !== undefined && response.ok) {
      //   output.textContent = "Result: " + data.result;
      // } else {
      //   output.textContent = "Error: " + data.error + ", Details:" + data.details;
      // }


      const output = document.getElementById("output");
      const number1 = document.getElementById("number1").value;
      const number2 = document.getElementById("number2").value;

      if (number1 === "" || number2 === "") {
        output.textContent = "Error: please enter two numebers"
        return;
      }

      const payload = {
        number1: number1,
        operation: document.getElementById("operation").value,
        number2: number2
      };

      try{
        const response = await fetch("/calculate", {
          method: "POST",
          headers: {"Content-Type": "application/json"}, // what we telling server
          body: JSON.stringify(payload) // Js object to json text
        });

        const data = await response.json(); // converts json back to js object

        if (response.ok){
          output.textContent = "Result: " + data.result;
        } else{
          output.textContent = "Error: " + (data.error ?? "request failed (status " + response.status + ")");
        }
      } catch (err) {
        output.textContent = "Error: no valid reply from the server";
        console.error(err);
      }

    }
  </script>
</body>
</html>
